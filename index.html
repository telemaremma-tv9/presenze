<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-title" content="Presenze">
<meta name="theme-color" content="#1f5fbf">
<title>Presenze Telemaremma</title>
<style>
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d2b3a; background: #eef1f4; }
  .box { max-width: 420px; margin: 16vh auto 0; padding: 26px 22px; background: #fff; border: 1px solid #d5dce4; border-radius: 14px; text-align: center; }
  .box b { display: block; font-size: 19px; margin-bottom: 8px; }
  .box p { margin: 0; color: #5b6b7f; }
  .box p.err { color: #c62828; }
  .box button { margin-top: 16px; font: inherit; font-weight: 700; padding: 10px 22px; border: 0; border-radius: 10px; background: #1f5fbf; color: #fff; cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="box" role="status" aria-live="polite">
  <b>Presenze Telemaremma</b>
  <p id="porta-msg">Caricamento…</p>
  <button type="button" id="porta-riprova" class="hidden">Riprova</button>
</div>
<script>
/* PRESENZE CDG · porta della web app (versione 1)
 *
 * Questo file NON cambia con le versioni del programma: carica la pagina dal programma
 * su Google e la fa parlare con Google senza l'account Google del browser (come una
 * finestra in incognito), così si apre anche dove ci sono uno o più account Google.
 * Qui non ci sono dati né password: ore e dipendenti restano nel file PRESENZE CDG.
 * Il link personale porta emp e token dopo # : restano nel browser, non arrivano a questo sito.
 */
(function () {
  var API = "https://script.google.com/macros/s/AKfycbwgDclvYDMemyehFmSZi_SHigus45BoUwbqrjkDQHe4W3TNpXlee2ikbaKJ2pX5XXjA/exec";

  // parametri dopo ? e dopo # (link personali: #emp=D001&token=…; guida: ?guida=1; amministrazione: ?admin=1)
  function parametri() {
    var out = {};
    [location.search.slice(1), location.hash.slice(1)].forEach(function (s) {
      new URLSearchParams(s).forEach(function (v, k) { out[k] = v; });
    });
    return { emp: out.emp || "", token: out.token || "", admin: out.admin || "", ticket: out.ticket || "", guida: out.guida || "" };
  }

  function messaggio(testo, errore) {
    var m = document.getElementById("porta-msg"), b = document.getElementById("porta-riprova");
    if (!m) return;
    m.textContent = testo;
    m.className = errore ? "err" : "";
    b.className = errore ? "" : "hidden";
  }

  // sostituisce questa pagina con quella del programma e fa partire i suoi script, nell'ordine
  function mostra(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
    Array.prototype.forEach.call(document.querySelectorAll("script"), function (vecchio) {
      var s = document.createElement("script");
      Array.prototype.forEach.call(vecchio.attributes, function (a) { s.setAttribute(a.name, a.value); });
      s.text = vecchio.text;
      vecchio.parentNode.replaceChild(s, vecchio);
    });
  }

  function carica() {
    messaggio("Caricamento…", false);
    fetch(API, {
      method: "POST", credentials: "omit", cache: "no-store", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ fn: "pagina", args: [parametri()] }),
    })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        if (!j || j.esito !== "ok" || !j.html) throw new Error((j && j.errore) || "risposta vuota");
        mostra(j.html);
      })
      .catch(function (e) {
        if (window.console) console.error("Presenze: " + (e && e.message || e));
        messaggio("Non riesco a collegarmi al programma delle presenze. Controlla la connessione e riprova.", true);
      });
  }

  document.getElementById("porta-riprova").addEventListener("click", carica);
  carica();
})();
</script>
</body>
</html>
